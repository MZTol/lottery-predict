name: 彩票预测
on:
  workflow_dispatch:
jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        run: git clone https://mzt:${{ secrets.GITEE_TOKEN }}@gitee.com/mzt/lottery-predict.git .
      - name: 运行预测
        run: |
          python 1.py 10
          python 2.py
          python 3.py
      - name: 生成首页
        run: |
          echo '<h1>彩票预测报告</h1>' > reports/index.html
          echo "<p>更新时间: $(date '+%Y-%m-%d %H:%M')</p>" >> reports/index.html
          for f in reports/*.html; do
            name=$(basename "$f")
            echo "<a href=\"$name\">$name</a><br>" >> reports/index.html
          done
      - name: 推送报告到仓库
        run: |
          git config user.name "MZT"
          git config user.email "1401478439@qq.com"
          git add reports/
          git commit -m "更新预测报告 $(date '+%Y-%m-%d')"
          git push