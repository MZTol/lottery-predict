name: 彩票预测
on:
  workflow_dispatch:

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 运行预测
        run: |
          python 1.py 10
          python 2.py
          python 3.py
      - name: 生成首页
        run: |
          mkdir -p reports
          echo '<h1>🎯 彩票预测报告</h1>' > reports/index.html
          echo "<p>更新时间: $(date '+%Y-%m-%d %H:%M')</p>" >> reports/index.html
          echo '<hr>' >> reports/index.html
          for f in reports/*.html; do
            name=$(basename "$f")
            if [ "$name" != "index.html" ]; then
              echo "<a href=\"$name\">📄 $name</a><br>" >> reports/index.html
            fi
          done
      - name: 部署到 Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
