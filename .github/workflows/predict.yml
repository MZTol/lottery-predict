name: 彩票预测
on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 运行预测
        run: |
          python 1.py 10
          python 2.py
          python 3.py

      - name: 复制报告
        run: |
          mkdir -p /tmp/reports
          cp reports/*.html /tmp/reports/ 2>/dev/null || true
          echo '<h1>🎯 彩票预测报告</h1>' > /tmp/reports/index.html
          echo "<p>更新时间: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')</p>" >> /tmp/reports/index.html
          for f in /tmp/reports/*.html; do
            name=$(basename "$f")
            if [ "$name" != "index.html" ]; then
              echo "<a href=\"$name\">📄 $name</a><br>" >> /tmp/reports/index.html
            fi
          done

      - name: 推送到 gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git remote set-url origin https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git

          # 切换到 gh-pages 分支，不存在则创建
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages

          # 清理旧文件（排除 .git）
          git rm -rf . 2>/dev/null || true

          # 复制新报告
          cp /tmp/reports/*.html .

          git add .
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "更新报告 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            git push origin gh-pages --force
          fi
