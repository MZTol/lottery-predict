name: 彩票预测
on:
  workflow_dispatch:
  schedule:
    # 北京时间 18:00：开奖前生成预测
    - cron: '0 10 * * *'
    # 北京时间 22:10：开奖后刷新数据并复盘上一期预测
    - cron: '10 14 * * *'

permissions:
  contents: write

concurrency:
  group: lottery-predict
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 恢复预测历史
        run: |
          git fetch origin gh-pages --depth=1 || true
          git show origin/gh-pages:predictions_history.json > predictions_history.json 2>/dev/null || true
          if [ -s predictions_history.json ] && python -m json.tool predictions_history.json >/dev/null 2>&1; then
            echo "已恢复 predictions_history.json"
          else
            rm -f predictions_history.json
            echo "未找到历史预测文件，将从本次运行开始记录"
          fi

      - name: 运行预测
        run: |
          python 1.py 10
          python 2.py
          python 3.py
          python review_report.py all

      - name: 生成发布文件
        run: |
          mkdir -p /tmp/reports
          cp reports/*.html /tmp/reports/ 2>/dev/null || true
          cp predictions_history.json /tmp/reports/ 2>/dev/null || true

          report_count=$(find /tmp/reports -maxdepth 1 -name '*.html' ! -name 'index.html' | wc -l)
          if [ "$report_count" -eq 0 ]; then
            echo "未生成任何 HTML 报告"
            exit 1
          fi

          SITE_UPDATED_AT="$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')" python site_index.py /tmp/reports

      - name: 推送到 gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git remote set-url origin https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git

          # 切换到 gh-pages 分支，不存在则创建
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages

          # 清理旧文件（排除 .git）
          git rm -rf . 2>/dev/null || true

          # 复制新报告
          cp /tmp/reports/*.html .
          cp /tmp/reports/predictions_history.json . 2>/dev/null || true

          git add .
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "更新报告 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            git push origin gh-pages --force
          fi
